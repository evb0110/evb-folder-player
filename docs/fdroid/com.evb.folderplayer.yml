AutoName: EVB Folder Player

RepoType: git
Repo: https://github.com/evb0110/evb-folder-player.git
Binaries: 
  https://github.com/evb0110/evb-folder-player/releases/download/v%v/EVB-Folder-Player-%v-arm64-v8a.apk

Builds:
  - versionName: 0.3.4
    versionCode: 7
    commit: e8b22031a2b198397e1e541b86658699223a000c
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless nodejs npm
    init:
      - export EXPO_NO_TELEMETRY=1
      - npm ci --no-audit --no-fund
    output: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    prebuild:
      - node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json"));
        p.expo={...p.expo,autolinking:{...p.expo?.autolinking,android:{...p.expo?.autolinking?.android,buildFromSource:[".*"]}}};
        fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - export EXPO_NO_TELEMETRY=1
      - npx expo prebuild --platform android --no-install
      - sed -i '/signingConfig signingConfigs.debug/d; /android.buildTypes.release.signingConfig
        =/d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
    scandelete:
      - node_modules
    build:
      - cd android
      - gradle :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
    ndk: r27b

AllowedAPKSigningKeys: beac197d53b5f35d548f8e3b4050a306b30d233cd235830e2d92b1f62183feec

MaintainerNotes: |-
  android/ is generated by Expo prebuild. Build all Expo modules from source and
  scandelete scanner findings under node_modules, including bundled AARs and wrappers.
  The complete Linux lockfile supports npm ci without a lock-only repair.
  Release APKs use this Linux build and are signed separately on macOS with the
  developer key. Binaries verification must pass before publication.
  Only arm64-v8a ships here; GitHub also carries armeabi-v7a with the same versionCode.
  Scanner exception comments (kept here because rewritemeta removes YAML comments):
  # node_modules/hermes-compiler/hermesc/linux64-bin/hermesc: Host-only Hermes compiler; precedent com.guiforge.bati and xyz.hub13.remindiary.
  # node_modules/react-native/ReactAndroid/publish.gradle: Local Maven publishing output, not dependency download; precedent xyz.hub13.remindiary.
  # node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle: Local Maven publishing output, not dependency download; precedent com.guiforge.bati.
  # node_modules/react-native-svg/android/build.gradle: Legacy local React Native Maven path; artifacts resolve from Maven Central; precedent com.guiforge.bati.
  # node_modules/react-native-safe-area-context/android/build.gradle: Legacy local React Native Maven path; artifacts resolve from Maven Central; precedent com.guiforge.bati.

